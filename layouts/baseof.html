<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.tagline }}{{ end }}" />
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} — {{ .Site.Title }}{{ end }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;1,400&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&family=Fira+Code:wght@400&display=swap"
      rel="stylesheet"
    />
    {{ with resources.Get "css/global.css" }}
      {{ $css := . | resources.Minify | resources.Fingerprint }}
      <link rel="stylesheet" href="{{ $css.RelPermalink }}" integrity="{{ $css.Data.Integrity }}" />
    {{ end }}
    <script>
      // Set the theme attribute before first paint so there's no flash of the
      // wrong color scheme when a returning visitor has a stored preference.
      var stored = localStorage.getItem('theme');
      if (stored) document.documentElement.dataset.theme = stored;
    </script>
  </head>
  <body>
    <div class="watermark" aria-hidden="true"></div>
    <header class="site-header">
      {{ partial "header-nav-left.html" . }}
      <a href="{{ "/" | relURL }}" class="site-title" aria-label="Home">{{ partial "crest.html" (dict "size" 56) }}</a>
      {{ partial "header-nav-right.html" . }}
    </header>
    <main>
      {{ block "main" . }}{{ end }}
    </main>
    {{ partial "mermaid.html" . }}
  </body>
</html>
