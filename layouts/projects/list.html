{{ define "main" }}
  <h1>Projects</h1>
  <section>
    {{ range .Pages.ByParam "order" }}
      <div class="card">
        <div class="card-body">
          <h3>
            <a href="{{ .RelPermalink }}">{{ .Title }}</a>
            <span class="status {{ .Params.status }}">{{ .Params.status }}</span>
          </h3>
          <p>{{ .Params.summary }}</p>
          <div class="meta">
            <a href="{{ .RelPermalink }}">Read more</a>
            {{ with .Params.repo }} · <a href="{{ . }}">Repo</a>{{ end }}
          </div>
        </div>
      </div>
    {{ end }}
  </section>
{{ end }}
